# phase59-catalog-admin — splice under paths in openapi.yaml
# Tags: catalog-admin, phase59-catalog-admin on all operations

  /admin/categories:
    get:
      operationId: getCatalogAdminCategories
      tags: [catalog-admin, phase59-catalog-admin]
      summary: List all categories with subcategories
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [admin]
      responses:
        "200":
          description: Categories with nested subcategories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogCategoryWithSubcategories" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCatalogAdminCategory
      tags: [catalog-admin, phase59-catalog-admin]
      summary: Create a category
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogCreateCategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCategoryWithSubcategories" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/categories/sort:
    patch:
      operationId: sortCatalogAdminCategories
      tags: [catalog-admin, phase59-catalog-admin]
      summary: Bulk update category sort order
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogSortOrderInput" }
      responses:
        "200":
