# phase54-delivery — splice under components.schemas in openapi.yaml

    DeliveryAddress:
      type: object
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        phone: { type: string }
        street: { type: string }
        number: { type: string }
        floor: { type: string }
        postalCode: { type: string }
        city: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, phone, street, number, floor, postalCode, city, notes, active, createdAt]

    CourierBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        status: { type: string }
      required: [id, name]

    CourierSafe:
      type: object
      description: Courier record with bearer token stripped
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        status: { type: string }
        active: { type: boolean }
        vehicleType: { type: string }
        plate: { type: string }
        zonaHabitual: { type: string }
        turno: { type: string }
        earnedCashPending: { type: string }
        earnedCardPending: { type: string }
        totalDeliveries: { type: integer }
        avgDeliveryMinutes: { type: integer }
        hasToken: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, phone, status]

    DeliveryZone:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [postal_code, city, radius] }
        value:
          type: object
          additionalProperties: true
        deliveryFee: { type: string }
        minOrder: { type: string }
        estimatedMinutes: { type: integer }
        active: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, name, type, deliveryFee, minOrder, estimatedMinutes, active, sortOrder, createdAt]

    DeliveryOrderStatusHistory:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        changedBy: { type: string, format: uuid, nullable: true }
        changedByName: { type: string }
        device: { type: string }
        note: { type: string }
        source: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, orderId, toStatus, changedByName, createdAt]

    CourierSettlement:
      type: object
      properties:
        id: { type: string, format: uuid }
        courierId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        ordersCount: { type: integer }
        totalCash: { type: string }
        totalCard: { type: string }
        totalOnline: { type: string }
        tips: { type: string }
        expenses: { type: string }
        differences: { type: string }
        closedBy: { type: string, format: uuid, nullable: true }
        closedByName: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, courierId, periodStart, periodEnd, ordersCount, totalCash, totalCard, totalOnline, tips, expenses, differences, closedByName, notes, createdAt]

    CourierSettlementWithName:
      allOf:
        - { $ref: "#/components/schemas/CourierSettlement" }
        - type: object
          properties:
            courierName: { type: string }
          required: [courierName]

    DeliveryOrderListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, nullable: true }
        status: { type: string }
        channel: { type: string }
        deliveryType: { type: string }
        clientName: { type: string }
        clientPhone: { type: string }
        estimatedReadyAt: { type: string, format: date-time, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        deliveryFee: { type: string }
        onlinePaymentStatus: { type: string }
        courierId: { type: string, format: uuid, nullable: true }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        deliveryAddressId: { type: string, format: uuid, nullable: true }
        rejectionReason: { type: string, nullable: true }
        address: { $ref: "#/components/schemas/DeliveryAddress", nullable: true }
        courier: { $ref: "#/components/schemas/CourierBrief", nullable: true }
        total: { type: string }
      required: [id, status, deliveryType, clientName, createdAt, total]

    DeliveryOrderDetail:
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderItem" }
            history:
              type: array
              items: { $ref: "#/components/schemas/DeliveryOrderStatusHistory" }
            address: { $ref: "#/components/schemas/DeliveryAddress", nullable: true }
            courier: { $ref: "#/components/schemas/CourierBrief", nullable: true }

    DeliveryOrderCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        status: { type: string }
        total: { type: string }
        estimatedReadyAt: { type: string, format: date-time }
        matchedZone: { type: string, nullable: true }
        deliveryFee: { type: number }
        requiresKitchenSend: { type: boolean }
      required: [id, orderNumber, status, total, estimatedReadyAt, deliveryFee, requiresKitchenSend]

    CreateDeliveryOrderInput:
      type: object
      properties:
        deliveryType: { type: string, enum: [takeaway, delivery], default: takeaway }
        channel: { type: string, enum: [phone, counter, tpv], default: phone }
        clientName: { type: string }
        clientPhone: { type: string }
        scheduledAt: { type: string, format: date-time }
        deliveryAddress:
          type: object
          properties:
            street: { type: string }
            number: { type: string }
            floor: { type: string }
            postalCode: { type: string }
            city: { type: string }
            notes: { type: string }
          required: [street, number, postalCode, city]
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              formatId: { type: string, format: uuid }
              notes: { type: string }
              modifierIds: { type: array, items: { type: string, format: uuid } }
            required: [productId, quantity]
        paymentMethod: { type: string, default: on_arrival }
        overrideDeliveryFee: { type: number }
        discountAmount: { type: number, default: 0 }
        notes: { type: string }
        courierId: { type: string, format: uuid }
        saveAddress: { type: boolean }
      required: [clientName, items]

    PatchDeliveryOrderInput:
      type: object
      properties:
        status: { type: string }
        courierId: { type: string, format: uuid, nullable: true }
        estimatedReadyAt: { type: string, format: date-time }
        notes: { type: string }
        note: { type: string }

    DeliveryOrderPatchResult:
      type: object
      properties:
        success: { type: boolean }
        courierId: { type: string, format: uuid, nullable: true }
        idempotent: { type: boolean }
      required: [success]

    OnlineOrderInboxItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, nullable: true }
        status: { type: string }
        channel: { type: string }
        deliveryType: { type: string }
        clientName: { type: string }
        clientPhone: { type: string }
        estimatedReadyAt: { type: string, format: date-time, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        deliveryFee: { type: string }
        onlinePaymentStatus: { type: string }
        onlinePaymentRef: { type: string, nullable: true }
        courierId: { type: string, format: uuid, nullable: true }
        rejectionReason: { type: string, nullable: true }
        packagingCheckedAt: { type: string, format: date-time, nullable: true }
        deliveryAddressId: { type: string, format: uuid, nullable: true }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              productName: { type: string }
              quantity: { type: integer }
              unitPrice: { type: string }
              taxRate: { type: number }
            required: [id, productName, quantity, unitPrice]
        address: { $ref: "#/components/schemas/DeliveryAddress", nullable: true }
        courier: { $ref: "#/components/schemas/CourierBrief", nullable: true }
        total: { type: string }
      required: [id, status, deliveryType, clientName, createdAt, total]

    ConfirmOnlineOrderInput:
      type: object
      properties:
        estimatedReadyAt: { type: string, format: date-time }

    OnlineOrderConfirmResult:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
        status: { type: string }
        estimatedReadyAt: { type: string, format: date-time }
        notificationStatus: { type: string, enum: [not_configured, simulated] }
        requiresKitchenSend: { type: boolean }
      required: [ok, status, estimatedReadyAt, notificationStatus, requiresKitchenSend]

    RejectOnlineOrderInput:
      type: object
      properties:
        reason: { type: string }
      required: [reason]

    OnlineOrderRejectResult:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
        status: { type: string }
        notificationStatus: { type: string, enum: [not_configured, simulated] }
      required: [ok, status, notificationStatus]

    PatchOnlineOrderStatusInput:
      type: object
      properties:
        status: { type: string }
        estimatedReadyAt: { type: string, format: date-time }
      required: [status]

    OnlineOrderStatusResult:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
        status: { type: string }
        notificationStatus: { type: string, enum: [not_configured, simulated] }
      required: [ok, status, notificationStatus]

    PaymentSimulateInput:
      type: object
      properties:
        approve: { type: boolean, default: true }

    PaymentSimulateResult:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
        approved: { type: boolean }
        ref: { type: string, nullable: true }
      required: [ok, approved]

    AssignCourierInput:
      type: object
      properties:
        courierId: { type: string, format: uuid }
      required: [courierId]

    AssignCourierResult:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
        courier: { $ref: "#/components/schemas/CourierBrief" }
      required: [ok, courier]

    OkResponse:
      type: object
      properties:
        ok: { type: boolean, enum: [true] }
      required: [ok]

    OnlineOrdersConfigMasked:
      type: object
      properties:
        id: { type: string, format: uuid }
        takeawayEnabled: { type: boolean }
        deliveryEnabled: { type: boolean }
        schedule:
          type: object
          additionalProperties:
            type: object
            properties:
              open: { type: string }
              close: { type: string }
              open2: { type: string }
              close2: { type: string }
        prepTimeMinutes: { type: integer }
        minOrder: { type: string }
        minOrderDelivery: { type: string }
        deliveryFee: { type: string }
        freeDeliveryFrom: { type: string, nullable: true }
        maxAdvanceHours: { type: integer }
        maxOrdersPerSlot: { type: integer }
        paused: { type: boolean }
        pauseReason: { type: string }
        tipEnabled: { type: boolean }
        tipPercentages: { type: array, items: { type: number } }
        tableOrderingEnabled: { type: boolean }
        stripePublishableKey: { type: string }
        stripeSecretKey: { type: string }
        stripeWebhookSecret: { type: string }
        updatedAt: { type: string, format: date-time }
      required: [id, takeawayEnabled, deliveryEnabled, prepTimeMinutes, minOrder, minOrderDelivery, deliveryFee, maxAdvanceHours, maxOrdersPerSlot, paused, pauseReason, tipEnabled, tableOrderingEnabled, stripePublishableKey, updatedAt]

    AdminOnlineConfigResponse:
      type: object
      properties:
        config: { $ref: "#/components/schemas/OnlineOrdersConfigMasked", nullable: true }
        zones: { type: array, items: { $ref: "#/components/schemas/DeliveryZone" } }
        couriers: { type: array, items: { $ref: "#/components/schemas/CourierSafe" } }
      required: [zones, couriers]

    PatchOnlineConfigInput:
      type: object
      properties:
        takeawayEnabled: { type: boolean }
        deliveryEnabled: { type: boolean }
        schedule:
          type: object
          additionalProperties:
            type: object
            properties:
              open: { type: string }
              close: { type: string }
              open2: { type: string }
              close2: { type: string }
        prepTimeMinutes: { type: integer }
        minOrder: { type: string }
        minOrderDelivery: { type: string }
        deliveryFee: { type: string }
        freeDeliveryFrom: { type: string }
        maxAdvanceHours: { type: integer }
        maxOrdersPerSlot: { type: integer }
        paused: { type: boolean }
        pauseReason: { type: string }
        tipEnabled: { type: boolean }
        tipPercentages: { type: array, items: { type: number } }
        tableOrderingEnabled: { type: boolean }
        stripePublishableKey: { type: string }

    CreateDeliveryZoneInput:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [postal_code, city, radius], default: postal_code }
        value: { type: object, additionalProperties: true }
        deliveryFee: { type: string, default: "0" }
        minOrder: { type: string, default: "0" }
        estimatedMinutes: { type: integer, default: 45 }
        sortOrder: { type: integer, default: 0 }
      required: [name]

    PatchDeliveryZoneInput:
      type: object
      additionalProperties: true

    CreateCourierInput:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
      required: [name]

    PatchCourierInput:
      type: object
      additionalProperties: true

    CourierAdminSummary:
      type: object
      properties:
        courier:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone: { type: string }
            status: { type: string }
            vehicleType: { type: string }
            plate: { type: string }
            earnedCashPending: { type: string }
            earnedCardPending: { type: string }
            totalDeliveries: { type: integer }
          required: [id, name, phone, status]
        activeOrders:
          type: array
          items:
            type: object
            additionalProperties: true
        todayDeliveries: { type: integer }
      required: [courier, activeOrders, todayDeliveries]

    SettleCourierInput:
      type: object
      properties:
        tips: { type: number, default: 0 }
        expenses: { type: number, default: 0 }
        differences: { type: number, default: 0 }
        notes: { type: string, default: "" }

    SettleCourierResult:
      type: object
      properties:
        settlement: { $ref: "#/components/schemas/CourierSettlement" }
      required: [settlement]
