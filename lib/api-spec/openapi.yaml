        country:
          type: string
        email:
          type: string
        phone:
          type: string
      required: [name]

    DocumentAuditEntry:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        documentType:
          type: string
        documentId:
          type: string
        employeeId:
          type: string
          nullable: true
        employeeName:
          type: string
        terminal:
          type: string
        printCount:
          type: integer
        amount:
          type: string
          nullable: true
        details:
          type: string
        createdAt:
          type: string
      required: [id, action, documentType, documentId, employeeName, terminal, printCount, details, createdAt]

    DocumentAuditLog:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DocumentAuditEntry"
        page:
          type: integer
        limit:
          type: integer
      required: [rows, page, limit]

    CreateReprintInput:
      type: object
      properties:
        documentId:
          type: string
        documentType:
          type: string
        reason:
          type: string
      required: [documentId, documentType]
