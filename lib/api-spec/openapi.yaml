    CashPaymentsTip:
      type: object
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount: { type: string }
        method: { type: string, enum: [cash, card] }
        cashSessionId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
      required: [id, paymentId, orderId, amount, method, createdAt]

    CashPaymentsReportMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        movementType: { $ref: "#/components/schemas/CashPaymentsMovementType" }
        amount: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        employeeName: { type: [string, "null"] }
      required: [id, movementType, amount, reason, createdAt]

    CashPaymentsReportTip:
      type: object
      properties:
        amount: { type: string }
        method: { type: string, enum: [cash, card] }
      required: [amount, method]

    CashPaymentsReportVoid:
      type: object
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
