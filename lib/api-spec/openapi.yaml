components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Employee:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required: [id, name, role]

    PinLoginInput:
      type: object
      properties:
        employeeId:
          type: string
        pin:
          type: string
      required: [employeeId, pin]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        employee:
          $ref: "#/components/schemas/Employee"
      required: [token, employee]

    Zone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        sortOrder:
          type: integer
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        active:
          type: boolean
        activeLayout:
          type: string
      required: [id, name, type, sortOrder]

    Table:
      type: object
      properties:
        id:
          type: string
        zoneId:
          type: string
        name:
          type: string
        capacity:
          type: integer
        status:
          type: string
        x:
          type: integer
        y:
          type: integer
        width:
