openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Piccolo TPV API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: employees
    description: Employee management
  - name: zones
    description: Room zones
  - name: tables
    description: Restaurant tables
  - name: dashboard
    description: Dashboard summaries
  - name: categories
    description: Menu categories and products
  - name: orders
    description: Order management
  - name: kds
    description: Kitchen Display System
  - name: config
    description: Business configuration
  - name: documents
    description: Document templates, invoices, printers, and audit log
  - name: branding
    description: Public and admin branding for QR carta
  - name: crm
    description: CRM clients, loyalty, gift cards, promotions and campaigns
  - name: phase51-wallet
    description: Client wallet (monedero) and gift cards (tarjetas regalo)
  - name: delivery
    description: Delivery orders, couriers, zones and online TPV inbox
  - name: phase54-delivery
    description: Entrega 54 — delivery domain contract scope
  - name: timeclock
    description: Employee timeclock (fichaje), tablet kiosk, PIN and NFC
  - name: phase56-timeclock
    description: Entrega 56 — fichaje domain contract scope
  - name: catalog-admin
    description: Catalog administration — categories, products, modifiers, allergens
  - name: phase59-catalog-admin
    description: Entrega 59 — catalog admin domain contract scope






  - name: cash-payments
    description: Cash sessions, order payments, split bills, tips and fail-closed cash-machine operations
  - name: phase61-cash-payments
    description: Entrega 61 — Cash & Payments domain contract scope

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /employees/login-list:
    get:
      operationId: getEmployeeLoginList
      tags: [employees]
      summary: Get list of active employees for login
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"

  /auth/pin:
    post:
      operationId: authWithPin
      tags: [auth]
      summary: Authenticate employee with PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginInput"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones:
    get:
      operationId: getZones
      tags: [zones]
      summary: Get all active zones (admin can pass ?all=true to include inactive)
      security:
        - bearerAuth: []
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createZone
      tags: [zones]
      summary: Create a new zone (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZoneInput"
      responses:
        "201":
          description: Zone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones/{zoneId}:
    patch:
      operationId: updateZone
      tags: [zones]
      summary: Update a zone name or order (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateZoneInput"
      responses:
        "200":
          description: Zone updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "404":
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Sort order conflict – another user reordered zones since last fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteZone
      tags: [zones]
      summary: Delete (soft) a zone (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Zone deleted
        "404":
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones/{zoneId}/duplicate:
    post:
      operationId: duplicateZone
      tags: [zones]
      summary: Duplicate a zone and all its tables (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Duplicated zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "404":
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones/{zoneId}/elements:
    get:
      operationId: getCanvasElements
      tags: [tables]
      summary: Get canvas elements (walls, doors, bar, columns) for a zone layout
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
        - name: layout
          in: query
          required: false
          schema:
            type: string
            enum: [normal, verano, invierno, eventos]
      responses:
        "200":
          description: List of canvas elements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasElement"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCanvasElement
      tags: [tables]
      summary: Create a canvas element (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCanvasElementInput"
      responses:
        "201":
          description: Element created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasElement"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /elements/{elementId}:
    patch:
      operationId: updateCanvasElement
      tags: [tables]
      summary: Update a canvas element (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: elementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCanvasElementInput"
      responses:
        "200":
          description: Element updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasElement"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCanvasElement
      tags: [tables]
      summary: Delete a canvas element (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: elementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Element deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /zones/{zoneId}/tables:
    get:
      operationId: getZoneTables
      tags: [tables]
      summary: Get tables for a zone
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
        - name: layout
          in: query
          required: false
          schema:
            type: string
            enum: [normal, verano, invierno, eventos]
      responses:
        "200":
          description: List of tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTable
      tags: [tables]
      summary: Create a table in a zone (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableInput"
      responses:
        "201":
          description: Table created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}:
    patch:
      operationId: updateTable
      tags: [tables]
      summary: Update table layout and properties (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTableInput"
      responses:
        "200":
          description: Table updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTable
      tags: [tables]
      summary: Delete a table (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Table deleted
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Table has an active order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /tables:
    get:
      operationId: getAllTables
      tags: [tables]
      summary: Get all tables across all zones
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}/open:
    post:
      operationId: openTable
      tags: [tables]
      summary: Open (occupy) a free table and create/return its active order
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenTableInput"
      responses:
        "200":
          description: Table opened with active order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableWithOrder"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Table not free
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}/duplicate:
    post:
      operationId: duplicateTable
      tags: [tables]
      summary: Duplicate a table (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Duplicated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tables/{tableId}/close:
    post:
      operationId: closeTable
      tags: [tables]
      summary: Move a service table to pending cleaning
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
                reason: { type: string, minLength: 3 }
      responses:
        "200":
          description: Table in pending-cleaning state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing force-close permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Table not occupied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: A mandatory force-close reason was not supplied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /tables/{tableId}/order:
    get:
      operationId: getTableOrder
      tags: [orders]
      summary: Get active order for an occupied table
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table with its active order and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableWithOrder"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No active order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories:
    get:
      operationId: getCatalogStaffCategories
      tags: [categories, catalog-admin, phase59-catalog-admin]
      summary: List active categories for staff TPV
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [authenticated]
      responses:
        "200":
          description: Active categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogStaffCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /categories/{categoryId}/products:
    get:
      operationId: getCatalogStaffCategoryProducts
      tags: [categories, catalog-admin, phase59-catalog-admin]
      summary: List active TPV-visible products for a category
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [authenticated]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Products with formats and modifier flag
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogStaffCategoryProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/{orderId}/items:
    post:
      operationId: addOrderItem
      tags: [orders]
      summary: Add an item to an order
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrderItemInput"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /order-items/{itemId}:
    patch:
      operationId: updateOrderItem
      tags: [orders, phase1-floor]
      summary: Update quantity, notes, allergy or invitation flag on a line item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderItemInput"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
        "400":
          description: Cannot change quantity of sent item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOrderItem
      tags: [orders]
      summary: Delete a draft item or cancel a sent item with stock reversal
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Draft item deleted or sent item cancelled
        "400":
          description: Item not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{orderId}/send:
    post:
      operationId: sendOrder
      tags: [orders]
      summary: Send order to production (creates kitchen tasks)
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Replays the stored successful response when the same user and key retry.
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Order sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: No draft items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order is already in billing or another conflicting state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Required print-only dispatch could not be persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /kds/{zone}:
    get:
      operationId: getKdsTasks
      tags: [kds]
      summary: Get kitchen tasks for a production zone
      security:
        - bearerAuth: []
      parameters:
        - name: zone
          in: path
          required: true
          schema:
            type: string
            enum: [cocina, pizza, ensalada, barra, pase, sin_partida]
      responses:
        "200":
          description: Kitchen tasks for the zone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KitchenTask"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403": { $ref: "#/components/responses/Forbidden" }

  /kitchen-tasks/{taskId}/status:
    patch:
      operationId: updateKitchenTaskStatus
      tags: [kds, phase1-floor]
      summary: Update status of a kitchen task
      security:
        - bearerAuth: []
