components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: piccolo_session
    deviceTokenAuth:
      type: apiKey
      in: header
      name: x-device-token
      description: Tablet device credential issued at registration

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated user lacks the required role or permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Current resource state conflicts with the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceUnavailable:
      description: Session or authorization verification is temporarily unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
      required: [id, name, role]

    PinLoginInput:
      type: object
      properties:
        employeeId:
          type: string
        pin:
          type: string
      required: [employeeId, pin]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        employee:
          $ref: "#/components/schemas/Employee"
      required: [token, employee]

    Zone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        sortOrder:
          type: integer
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        active:
          type: boolean
        activeLayout:
          type: string
      required: [id, name, type, sortOrder]

    Table:
      type: object
      properties:
        id:
          type: string
        zoneId:
          type: string
        name:
          type: string
        capacity:
          type: integer
        status:
          $ref: "#/components/schemas/TableStatus"
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        shape:
          type: string
        rotation:
          type: integer
          default: 0
        layout:
          type: string
          default: normal
        mergeGroup:
          type: string
          nullable: true
        currentOrderId:
          type: string
          nullable: true
        openedAt:
          type: string
          format: date-time
          nullable: true
        employeeName:
          type: string
          nullable: true
        currentTotal:
          type: number
          nullable: true
        active:
          type: boolean
        guestCount:
          type: integer
          nullable: true
        clientName:
          type: string
          nullable: true
      required: [id, zoneId, name, capacity, status, x, y, width, height, shape, rotation, layout, active, currentOrderId, openedAt, employeeName, guestCount, clientName, currentTotal]

    TableStatus:
      type: string
      enum: [free, reserved, occupied, pendiente_limpieza, bloqueada, out_of_service, comanda_abierta, prefactura_impresa, pendiente_cobro, parcialmente_cobrada, waiting, bill_requested]

