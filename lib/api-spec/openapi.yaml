            type: integer
      responses:
        "200":
          description: Audit log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAuditLog"

  /tables/occupation-summary:
    get:
      operationId: getOccupationSummary
      tags: [tables, phase1-floor]
      summary: Get current table occupation counters
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Aggregated occupation and reservation counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupationSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tables/{tableId}/history:
    get:
      operationId: getTableHistory
      tags: [tables, phase1-floor]
      summary: Get the chronological event history for a table
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      parameters:
        - $ref: "#/components/parameters/TableId"
      responses:
        "200":
          description: Table events ordered by creation time
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TableEvent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/alert-config:
    get:
      operationId: getAlertConfig
      tags: [tables, phase1-floor]
      summary: Get operational table alert thresholds
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      responses:
        "200":
          description: Existing or default-initialized alert configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: patchAlertConfig
      tags: [tables, phase1-floor]
      summary: Update positive table alert thresholds
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAlertConfigInput" }
            example: { reservaProximaMin: 30, sinComandaMin: 15 }
      responses:
        "200":
          description: Updated alert configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tables/{tableId}/clean:
    post:
      operationId: cleanTable
      tags: [tables, phase1-floor]
      summary: Mark a pending-cleaning table as free
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TableId"
      responses:
        "200":
          description: Freed table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tables/{tableId}/block:
    post:
      operationId: blockTable
      tags: [tables, phase1-floor]
      summary: Toggle a table between blocked and free
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      parameters:
        - $ref: "#/components/parameters/TableId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
            example: { reason: Mantenimiento }
      responses:
        "200":
          description: Table after the toggle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tables/{tableId}/transfer:
    post:
      operationId: transferTable
      tags: [tables, orders, phase1-floor]
      summary: Move an open order to a free table atomically
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TableId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TableIdInput" }
      responses:
        "200":
          description: Transfer result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableTransferResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tables/merge:
    post:
      operationId: mergeTables
      tags: [tables, orders, phase1-floor]
      summary: Merge at least two tables and consolidate their open orders
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeTablesInput" }
            example: { tableIds: [11111111-1111-4111-8111-111111111111, 22222222-2222-4222-8222-222222222222] }
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeTablesResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tables/{tableId}/separate:
    post:
      operationId: separateTable
      tags: [tables, orders, phase1-floor]
      summary: Separate all tables in an existing merge group
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      parameters:
        - $ref: "#/components/parameters/TableId"
      responses:
        "200":
          description: Group separated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{orderId}/move-items:
    post:
      operationId: moveItems
      tags: [orders, tables, phase1-floor]
      summary: Move selected order items to an order on another table
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveItemsInput" }
      responses:
        "200":
          description: Item move result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveItemsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tables/{tableId}/transfer-waiter:
    post:
      operationId: transferWaiter
      tags: [tables, orders, phase1-floor]
      summary: Reassign the open table order to another employee
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      parameters:
        - $ref: "#/components/parameters/TableId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferWaiterInput" }
      responses:
        "200":
          description: Waiter transfer result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferWaiterResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{orderId}/prefactura/print:
    post:
      operationId: createPrefacturaPrint
      tags: [orders, phase1-floor]
      summary: Allocate or reuse a prefactura number and record a print
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "201":
          description: Prefactura print record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefacturaPrintResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{orderId}/prefactura/status:
    get:
      operationId: getPrefacturaStatus
      tags: [orders, phase1-floor]
      summary: Get prefactura print status for an order
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Prefactura status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrefacturaStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /kds/history:
    get:
      operationId: getKdsHistory
      tags: [kds, phase1-floor]
      summary: Get terminal KDS tasks updated in the last eight hours
      security: [{ bearerAuth: [] }]
      x-roles: [admin, manager, encargado, waiter, kitchen]
      responses:
        "200":
          description: At most 200 collected, served or cancelled tasks
          content:
            application/json:
              schema: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/KitchenTask" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /kitchen-tasks/{taskId}/resend:
    post:
      operationId: resendKitchenTask
      tags: [kds, phase1-floor]
      summary: Reset a non-terminal kitchen task to new
      security: [{ bearerAuth: [] }]
      x-roles: [admin, manager, encargado, waiter, kitchen]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Reset task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenTaskRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/kds-stations:
    get:
      operationId: getKdsStations
      tags: [kds, phase1-floor]
      summary: List configured KDS stations
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      responses:
        "200":
          description: KDS stations ordered by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KdsStation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createKdsStation
      tags: [kds, phase1-floor]
      summary: Create a KDS station
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKdsStationInput" }
            example: { name: Cocina principal, zoneType: cocina, ip: 192.0.2.10 }
      responses:
        "201":
          description: Created station
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KdsStation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/kds-stations/{id}:
    patch:
      operationId: updateKdsStation
      tags: [kds, phase1-floor]
      summary: Partially update a KDS station
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateKdsStationInput" }
      responses:
        "200":
          description: Updated station
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KdsStation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteKdsStation
      tags: [kds, phase1-floor]
      summary: Soft-delete a KDS station
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Station disabled
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, enum: [true] } }
                required: [ok]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/kds-stations/{id}/ping:
    post:
      operationId: pingKdsStation
      tags: [kds, phase1-floor]
      summary: Probe a KDS display URL or IP with a three-second timeout
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KdsPingResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/kds-zones/transitions:
    get:
      operationId: getKdsZoneTransitions
      tags: [kds, phase1-floor]
      summary: Get the KDS state machines used by every preparation zone
      security: [{ bearerAuth: [] }]
      x-roles: [manager, admin]
      responses:
        "200":
          description: Zone transition maps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KdsTransitions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The authenticated user lacks the required role or permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Current resource state conflicts with the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Employee:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required: [id, name, role]

    PinLoginInput:
      type: object
      properties:
        employeeId:
          type: string
        pin:
          type: string
      required: [employeeId, pin]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        employee:
          $ref: "#/components/schemas/Employee"
      required: [token, employee]

    Zone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        sortOrder:
          type: integer
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        active:
          type: boolean
        activeLayout:
          type: string
      required: [id, name, type, sortOrder]

    Table:
      type: object
      properties:
        id:
          type: string
        zoneId:
          type: string
        name:
          type: string
        capacity:
          type: integer
        status:
          $ref: "#/components/schemas/TableStatus"
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        shape:
          type: string
        rotation:
          type: integer
          default: 0
        layout:
          type: string
          default: normal
        mergeGroup:
          type: string
          nullable: true
        currentOrderId:
          type: string
          nullable: true
        openedAt:
          type: string
          format: date-time
          nullable: true
        employeeName:
          type: string
          nullable: true
        currentTotal:
          type: number
          nullable: true
        active:
          type: boolean
        guestCount:
          type: integer
          nullable: true
        clientName:
          type: string
          nullable: true
      required: [id, zoneId, name, capacity, status, x, y, width, height, shape, rotation, layout, active, currentOrderId, openedAt, employeeName, guestCount, clientName, currentTotal]

    TableStatus:
      type: string
      enum: [free, reserved, occupied, pendiente_limpieza, bloqueada, out_of_service, comanda_abierta, prefactura_impresa, pendiente_cobro, parcialmente_cobrada, waiting, bill_requested]

    CanvasElement:
      type: object
      properties:
        id:
          type: string
        zoneId:
          type: string
        layout:
          type: string
        type:
          type: string
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        rotation:
          type: integer
          default: 0
        color:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        active:
          type: boolean
      required: [id, zoneId, layout, type, x, y, width, height, rotation, active]

    CreateCanvasElementInput:
      type: object
      properties:
        type:
          type: string
          enum: [wall, door, bar, column, window]
        layout:
          type: string
          enum: [normal, verano, invierno, eventos]
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        rotation:
          type: integer
        color:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
      required: [type]

    UpdateCanvasElementInput:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        rotation:
          type: integer
        color:
          type: string
          nullable: true
        label:
          type: string
          nullable: true

    CreateZoneInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
      required: [name]

    UpdateZoneInput:
      type: object
      properties:
        name:
          type: string
        sortOrder:
          type: integer
        expectedSortOrder:
          type: integer
          description: >
            Optimistic concurrency guard for reordering. When provided together
            with sortOrder, the server only applies the update if the row's
            current sortOrder still matches this value. Returns 409 if not.
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        active:
          type: boolean
        activeLayout:
          type: string
          enum: [normal, verano, invierno, eventos]

    CreateTableInput:
      type: object
      properties:
        name:
          type: string
        capacity:
          type: integer
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        shape:
          type: string
        rotation:
          type: integer
        layout:
          type: string
          enum: [normal, verano, invierno, eventos]
      required: [name]

    UpdateTableInput:
      type: object
      properties:
        name:
          type: string
        capacity:
          type: integer
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        shape:
          type: string
        rotation:
          type: integer
        layout:
          type: string
          enum: [normal, verano, invierno, eventos]
        mergeGroup:
          type: string
          nullable: true

    Order:
      type: object
      properties:
        id:
          type: string
        tableId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        orderType:
          type: string
        status:
          type: string
        guestCount:
          type: integer
        notes:
          type: string
        clientName:
          type: string
        clientId:
          type: string
          format: uuid
          nullable: true
        openedByTerminal:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        channel:
          type: string
        deliveryType:
          type: string
        orderNumber:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        estimatedReadyAt:
          type: string
          format: date-time
          nullable: true
        clientPhone:
          type: string
        deliveryAddressId:
          type: string
          format: uuid
          nullable: true
        courierId:
          type: string
          format: uuid
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        onlinePaymentRef:
          type: string
          nullable: true
        onlinePaymentStatus:
          type: string
        packagingCheckedBy:
          type: string
          format: uuid
          nullable: true
        packagingCheckedAt:
          type: string
          format: date-time
          nullable: true
        deliveryFee:
          $ref: "#/components/schemas/Money"
        tipAmount:
          $ref: "#/components/schemas/Money"
        idempotencyKey:
          type: string
          nullable: true
        tableSessionId:
          type: string
          format: uuid
          nullable: true
        isDemo:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [id, tableId, employeeId, orderType, status, guestCount, notes, clientName, openedByTerminal, createdAt, sentAt, channel, deliveryType, orderNumber, scheduledAt, estimatedReadyAt, clientPhone, deliveryAddressId, courierId, rejectionReason, onlinePaymentRef, onlinePaymentStatus, packagingCheckedBy, packagingCheckedAt, deliveryFee, tipAmount, idempotencyKey, tableSessionId, isDemo]

    TableWithOrder:
      type: object
      properties:
        table:
          $ref: "#/components/schemas/Table"
        order:
          $ref: "#/components/schemas/Order"
      required: [table, order]

    OrderItem:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        productId:
          type: string
        productName:
          type: string
        formatId:
          type: string
          nullable: true
        formatName:
          type: string
          nullable: true
        quantity:
          type: integer
        unitPrice:
          type: string
        status:
          type: string
        notes:
          type: string
        allergyNote:
          type: string
        hasAllergy:
          type: boolean
        isInvitation:
          type: boolean
        modifiers:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemModifier"
        createdAt:
          type: string
      required: [id, orderId, productId, productName, quantity, unitPrice, status, createdAt, notes, allergyNote, hasAllergy, isInvitation]

    OrderItemModifier:
      type: object
