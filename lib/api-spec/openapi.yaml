        status: { type: string, enum: [open, paid] }
        total: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              orderItemId: { type: string, format: uuid }
              quantity: { type: number }
            required: [orderItemId, quantity]
      required: [id, orderId, label, status, total, sortOrder, createdAt, items]

    CashPaymentsCreateSplitsInput:
      type: object
      properties:
        groups:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            properties:
              label: { type: string }
              total: { oneOf: [{ type: string }, { type: number }] }
              items:
                type: array
                items:
                  type: object
                  properties:
                    orderItemId: { type: string, format: uuid }
                    quantity: { type: number }
                  required: [orderItemId, quantity]
            required: [label, items]
      required: [groups]

    CashPaymentsMarkSplitPaidInput:
      type: object
      properties:
        paymentId: { type: string, format: uuid }

    CashPaymentsCreateTipInput:
      type: object
      properties:
