# phase49-crm — splice under paths in openapi.yaml
# Tags: crm, phase49-crm on all operations
# CRM_STAFF = [waiter, cashier, manager, admin]

  /crm/clients:
    get:
      operationId: getCrmClients
      tags: [crm, phase49-crm]
      summary: Search or list CRM clients
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [waiter, cashier, manager, admin]
      parameters:
        - { in: query, name: q, schema: { type: string }, description: "Search by name, surname, phone or email" }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Matching clients
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CrmClient" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createCrmClient
      tags: [crm, phase49-crm]
      summary: Create a new CRM client
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [waiter, cashier, manager, admin]
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCrmClientInput" }
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmClient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Duplicate phone or email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmClientConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /crm/clients/{id}:
    get:
      operationId: getCrmClient
      tags: [crm, phase49-crm]
      summary: Get a CRM client by id
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [waiter, cashier, manager, admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: updateCrmClient
      tags: [crm, phase49-crm]
      summary: Partially update a CRM client
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [manager, admin]
      x-idempotent: false
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCrmClientInput" }
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

