# phase56-timeclock — splice under paths in openapi.yaml
# Tags: timeclock, phase56-timeclock on all operations

  /fichaje/public/employees:
    get:
      operationId: getTimeclockPublicEmployees
      tags: [timeclock, phase56-timeclock]
      summary: List active employees for tablet PIN selection
      security: [{ deviceTokenAuth: [] }]
      x-roles: [device]
      responses:
        "200":
          description: Active employees (id and name only)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimeclockEmployeeBrief" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fichaje/public/clock-status:
    get:
      operationId: getTimeclockMobileClockStatus
      tags: [timeclock, phase56-timeclock]
      summary: Mobile clock availability (fail-closed; always disabled at runtime)
      security: []
      x-roles: [public]
      responses:
        "200":
          description: Mobile clock status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockMobileClockStatus" }

  /fichaje/public/my-status/{employeeId}:
    get:
      operationId: getTimeclockPublicEmployeeStatus
      tags: [timeclock, phase56-timeclock]
      summary: Current clock state for an employee on a registered tablet
      security: [{ deviceTokenAuth: [] }]
      x-roles: [device]
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Employee clock status for today
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockEmployeeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fichaje/public/clock:
    post:
      operationId: postTimeclockPublicClock
      tags: [timeclock, phase56-timeclock]
      summary: Clock in/out or break via public fichaje screen (proof required)
      security: []
      x-roles: [device]
      x-device-credential: body
      x-idempotent: optional
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicClockInput" }
      responses:
        "200":
          description: Clock action applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockClockResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /fichaje/public/nfc/identify:
    post:
      operationId: postTimeclockNfcIdentify
      tags: [timeclock, phase56-timeclock]
      summary: Identify employee by NFC card and issue clock proofs
      security: []
      x-roles: [device]
      x-device-credential: body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NfcIdentifyInput" }
      responses:
        "200":
          description: Employee identified with ephemeral proofs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NfcIdentifyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: NFC anti-debounce (5s per card+device)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockRateLimitError" }

  /fichaje/records:
    get:
      operationId: getTimeclockRecords
      tags: [timeclock, phase56-timeclock]
      summary: List time records (self; managers may filter by employeeId)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [authenticated]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: employeeId, schema: { type: string, format: uuid }, description: Managers only }
      responses:
        "200":
          description: Time records (max 500)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimeclockRecordListItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /fichaje/records/today:
    get:
      operationId: getTimeclockRecordsToday
      tags: [timeclock, phase56-timeclock]
      summary: All employees clock status for today (managers)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [admin, manager, encargado]
      responses:
        "200":
          description: Today's records for all employees
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimeclockRecordListItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /fichaje/records/manual:
    post:
      operationId: createTimeclockManualRecord
      tags: [timeclock, phase56-timeclock]
      summary: Create a manual time record (managers)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [admin, manager, encargado]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualRecordInput" }
      responses:
        "201":
          description: Manual record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /fichaje/records/{id}:
    put:
      operationId: updateTimeclockRecord
      tags: [timeclock, phase56-timeclock]
      summary: Correct a time record (creates time_corrections audit row)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [admin, manager, encargado]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTimeclockRecordInput" }
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /fichaje/records/{id}/breaks:
    get:
      operationId: getTimeclockRecordBreaks
      tags: [timeclock, phase56-timeclock]
      summary: List breaks for an owned time record (administrative roles may access any record)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [authenticated]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Breaks ordered by breakStart
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimeclockBreak" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /fichaje/shifts:
    get:
      operationId: getTimeclockShifts
