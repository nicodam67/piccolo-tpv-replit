      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location: { type: string }
                status: { type: string, enum: [active, revoked] }
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TabletDeviceSafe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: revokeTabletDevice
      tags: [timeclock, phase56-timeclock]
      summary: Revoke tablet device (admin only)
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Device revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /tablet/register:
    post:
      operationId: registerTabletDevice
      tags: [timeclock, phase56-timeclock]
      summary: Register tablet with admin pairing code (issues deviceToken once)
      security: []
      x-roles: [pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabletRegisterInput" }
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TabletRegisterResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Invalid or expired pairing code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /tablet/device:
    get:
      operationId: getTabletDevice
      tags: [timeclock, phase56-timeclock]
      summary: Validate device token and return device info
      security: [{ deviceTokenAuth: [] }]
      x-roles: [device]
      responses:
        "200":
          description: Device info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TabletDeviceInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tablet/device/ping:
    post:
      operationId: pingTabletDevice
      tags: [timeclock, phase56-timeclock]
      summary: Heartbeat from tablet (updates lastSeenAt)
      security: [{ deviceTokenAuth: [] }]
      x-roles: [device]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabletPingInput" }
      responses:
        "200":
          description: Ping acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TabletPingResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tablet/verify-pin:
    post:
      operationId: verifyTabletPin
      tags: [timeclock, phase56-timeclock]
      summary: Verify employee PIN and issue clock proofs (3 attempts, 5 min lockout)
      security: []
      x-roles: [device]
      x-device-credential: body
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPinInput" }
      responses:
        "200":
          description: PIN verified with ephemeral proofs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyPinResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Fail-closed PIN denial (generic message)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyPinLockedError" }
        "429":
          description: PIN lockout active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyPinLockedError" }

  /tablet/clock:
    post:
      operationId: postTabletClock
      tags: [timeclock, phase56-timeclock]
      summary: Clock action from trusted tablet (bypasses mobileClockEnabled)
      security: []
      x-roles: [device]
      x-device-credential: body
      x-idempotent: optional
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabletClockInput" }
      responses:
        "200":
          description: Clock action applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeclockClockResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
