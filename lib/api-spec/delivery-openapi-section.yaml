# phase54-delivery — splice under paths in openapi.yaml
# Tags: delivery, phase54-delivery on all operations

  /delivery-orders:
    get:
      operationId: getDeliveryOrders
      tags: [delivery, phase54-delivery]
      summary: List delivery and takeaway orders with filters
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [waiter, cashier, manager, admin]
      parameters:
        - { in: query, name: date, schema: { type: string, format: date }, description: Filter by calendar day (YYYY-MM-DD) }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: status, schema: { type: string }, description: Skip filter when value is "all" }
        - { in: query, name: courierId, schema: { type: string, format: uuid } }
        - { in: query, name: type, schema: { type: string, enum: [delivery, takeaway] } }
      responses:
        "200":
          description: Delivery orders (max 200)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DeliveryOrderListItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createDeliveryOrder
      tags: [delivery, phase54-delivery]
      summary: Create a manual delivery or pickup order from the TPV
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [waiter, cashier, manager, admin]
      x-idempotent: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeliveryOrderInput" }
      responses:
        "201":
          description: Created delivery order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryOrderCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /delivery-orders/{id}:
    get:
      operationId: getDeliveryOrder
      tags: [delivery, phase54-delivery]
      summary: Get delivery order detail with items, history and address
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [waiter, cashier, manager, admin]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Delivery order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryOrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: patchDeliveryOrder
      tags: [delivery, phase54-delivery]
      summary: Update delivery order status, courier or notes
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      x-roles: [waiter, cashier, manager, admin]
      x-idempotent: false
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchDeliveryOrderInput" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryOrderPatchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

