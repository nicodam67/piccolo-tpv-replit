    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- Pre-load custom fonts so they are ready before JS/useEffect runs.
         Served locally from public/fonts/ — no external CDN dependency.
         These match the CUSTOM_FONTS list in FontManager.tsx / theme.ts. -->
    <style>
      @font-face { font-family: "Algerian__custom";      src: url("/qr-menu/fonts/Algerian__custom.ttf")      format("truetype"); font-display: swap; }
      @font-face { font-family: "AvantGardeBk__custom";  src: url("/qr-menu/fonts/AvantGardeBk__custom.ttf")  format("truetype"); font-display: swap; }
      @font-face { font-family: "AmericanTextBT__custom"; src: url("/qr-menu/fonts/AmericanTextBT__custom.ttf") format("truetype"); font-display: swap; }
      @font-face { font-family: "ZapfChanDm__custom";    src: url("/qr-menu/fonts/ZapfChanDm__custom.ttf")    format("truetype"); font-display: swap; }
      @font-face { font-family: "ZapfChanMd__custom";    src: url("/qr-menu/fonts/ZapfChanMd__custom.ttf")    format("truetype"); font-display: swap; }
    </style>

    <!-- Detect dark mode preference and set the class before next-themes loads. -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          let prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>
  </head>

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">

    "@context": "https://schema.org",

    "image": "https://piccolo-tpv.replit.app/qr-menu/icon/icon-512.png",
    "servesCuisine": ["Italian", "Pizza", "Mediterranean"],
    "priceRange": "€€",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "La Ràpita",
      "addressRegion": "Tarragona",
      "addressCountry": "ES"
    },
    "menu": "https://piccolo-tpv.replit.app/qr-menu/",
    "hasMenu": {
      "@type": "Menu",
      "name": "Carta Piccolo",
      "url": "https://piccolo-tpv.replit.app/qr-menu/"
    }
  }
  </script>

  <body>

  </body>
</html>
